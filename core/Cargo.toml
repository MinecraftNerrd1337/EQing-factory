[package]
name = "eqing_core"
version = "0.4.0"
edition = "2021"
description = "EQing Factory core: autoeq-c (FFI), data model, imports/exports"
license = "LGPL-3.0-or-later"

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "eqing-cli"
path = "src/bin/eqing-cli.rs"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
uniffi = "0.32"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[build-dependencies]
cc = "1"

[profile.release]
opt-level = 3
